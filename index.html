<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W1</title>
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <section>
      <nav>
        <img src="./assets/FES.svg" alt="" />
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#discord">Discord</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <header>
        <div>
          <h1>Best place to become a frontend dev</h1>
          <p>Go from being an absolute beginner to a pro</p>
          <button>Start now</button>
        </div>
        <figure>
          <img src="./assets/laptop.png" alt="HPI" />
        </figure>
      </header>
    </section>

    <section>
      <main>
        <section id="about">
          <h2>About</h2>
          <div>
            <p>About</p>
          </div>
          <figure>
            <img src="./assets/about.jpg" alt="A" />
          </figure>
        </section>

        <section id="discord">
          <h2>Discord</h2>
          <div>
            <p>Discord</p>
          </div>
          <figure>
            <img src="./assets/discord.png" alt="D" />
          </figure>
          <div>
            <p>Discord</p>
            <p>Discord 2</p>
          </div>
        </section>

        <section id="contact">
          <h2>Contact</h2>

          <form action="">

            <span>Email</span>
            <input type="text" placeholder="" />

            <span>Message</span>
            <textarea type="text"placeholder=""></textarea>

          </form>
        </section>
      </main>

      <footer>
        <img src="./assets/FES.svg" alt="" />
        <div>
          <a href="#about">About</a>
          <a href="#discord">Discord</a>
          <a href="#contact">Contact</a>
        </div>
        <p>frontend developer</p>
      </footer>
    </section>
  </body>
</html>
